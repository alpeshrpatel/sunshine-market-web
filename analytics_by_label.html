<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card .currency {
            color: #2ecc71;
        }

        .stat-card .number {
            color: #3498db;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .chart-container h3 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }

        .category-name {
            font-weight: 600;
            color: #333;
            text-transform: capitalize;
        }

        .positive {
            color: #2ecc71;
        }

        .negative {
            color: #e74c3c;
        }

        .profit-margin {
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .profit-high {
            background-color: #d5f4e6;
            color: #2ecc71;
        }

        .profit-medium {
            background-color: #fff3cd;
            color: #856404;
        }

        .profit-low {
            background-color: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
            
            .stat-card {
                padding: 20px;
            }
            
            .data-table {
                font-size: 0.8em;
            }
            
            .data-table th,
            .data-table td {
                padding: 8px 10px;
            }
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .file-input {
            margin: 10px;
            padding: 8px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>📊 Revenue Analytics Dashboard</h1>
            <p>Comprehensive sales performance analysis across all categories</p>
        </div>

        <div class="upload-section">
            <h3 style="margin-bottom: 20px; color: #333;">Upload Files for Analysis</h3>
            <div>
                <input type="file" id="csvFile" accept=".csv" class="file-input">
                <input type="file" id="excelFile" accept=".xlsx,.xls" class="file-input">
            </div>
            <button onclick="uploadAndAnalyze()" class="upload-btn">🔄 Analyze Revenue Data</button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h3>📈 Revenue Distribution</h3>
                <canvas id="revenueChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>📦 Items Sold by Category</h3>
                <canvas id="itemsChart"></canvas>
            </div>
        </div>

        <div class="table-container">
            <h3 style="margin-bottom: 20px; color: #333; text-align: center;">📋 Detailed Category Analysis</h3>
            <table class="data-table" id="dataTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Items Sold</th>
                        <th>Revenue</th>
                        <th>Total Price</th>
                        <th>Discount</th>
                        <th>Cost</th>
                        <th>Profit</th>
                        <th>Margin %</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Table rows will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Sample data - replace with actual API response
        const sampleData = {

            },

                "total_price": 505.49,

            },
            "vendor_noblebread": {

            },
            "fire sale": {

                "total_items_sold": 0,

                "total_discount": 0,

                "total_cost": 0
            },
            "frozen": {
                "category": "frozen",
                "total_items_sold": 11,
                "total_revenue": 87.89,
                "total_discount": 0,
                "total_price": 87.89,
                "total_cost": 60.06
            },
            "vendor_quail": {
                "category": "vendor_quail",
                "total_items_sold": 68,

            },
            "bill pay": {

                "total_revenue": 0,

            },
            "vendor_southernglazers": {

            },
            "lottery": {

            },
            "vendor_coke": {
                "category": "vendor_coke",
                "total_items_sold": 4214,
                "total_revenue": 10809.2,
                "total_discount": 0,
                "total_price": 10903.01,
                "total_cost": 5091.82
            },
            "track sales": {
                "category": "track sales",
                "total_items_sold": 167,
                "total_revenue": 636.33,
                "total_discount": 0,
                "total_price": 672.63,
                "total_cost": 380.08
            },
            "beer": {
                "category": "beer",
                "total_items_sold": 769,
                "total_revenue": 2132.31,
                "total_discount": 0,
                "total_price": 2293.67,
                "total_cost": 1370.65
            }
        };

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', { 
                style: 'currency', 
                currency: 'USD' 
            }).format(value);
        }

        function formatNumber(value) {
            return new Intl.NumberFormat('en-US').format(value);
        }

        function calculateTotals(data) {
            let totalRevenue = 0;
            let totalItems = 0;
            let totalCost = 0;
            let totalDiscount = 0;

            Object.values(data).forEach(item => {
                totalRevenue += item.total_revenue;
                totalItems += item.total_items_sold;
                totalCost += item.total_cost;
                totalDiscount += item.total_discount;
            });

            return {
                totalRevenue,
                totalItems,
                totalCost,
                totalDiscount,
                totalProfit: totalRevenue - totalCost,
                categories: Object.keys(data).length
            };
        }

        function updateStatsCards(data) {
            const totals = calculateTotals(data);
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <div class="value currency">${formatCurrency(totals.totalRevenue)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Items Sold</h3>
                    <div class="value number">${formatNumber(totals.totalItems)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Profit</h3>
                    <div class="value currency">${formatCurrency(totals.totalProfit)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Cost</h3>
                    <div class="value currency">${formatCurrency(totals.totalCost)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Discount</h3>
                    <div class="value currency">${formatCurrency(totals.totalDiscount)}</div>
                </div>
                <div class="stat-card">
                    <h3>Active Categories</h3>
                    <div class="value number">${totals.categories}</div>
                </div>
            `;
        }

        function updateTable(data) {
            const tableBody = document.getElementById('tableBody');
            const sortedData = Object.values(data).sort((a, b) => b.total_revenue - a.total_revenue);
            
            tableBody.innerHTML = '';
            
            sortedData.forEach(item => {
                const profit = item.total_revenue - item.total_cost;
                const margin = item.total_revenue > 0 ? (profit / item.total_revenue * 100) : 0;
                
                let marginClass = 'profit-low';
                if (margin > 50) marginClass = 'profit-high';
                else if (margin > 25) marginClass = 'profit-medium';
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="category-name">${item.category.replace(/_/g, ' ')}</td>
                    <td>${formatNumber(item.total_items_sold)}</td>
                    <td>${formatCurrency(item.total_revenue)}</td>
                    <td>${formatCurrency(item.total_price)}</td>
                    <td class="${item.total_discount < 0 ? 'negative' : 'positive'}">${formatCurrency(item.total_discount)}</td>
                    <td>${formatCurrency(item.total_cost)}</td>
                    <td class="${profit >= 0 ? 'positive' : 'negative'}">${formatCurrency(profit)}</td>
                    <td><span class="profit-margin ${marginClass}">${margin.toFixed(1)}%</span></td>
                `;
                tableBody.appendChild(row);
            });
        }

        let revenueChart = null;
        let itemsChart = null;

        function createRevenueChart(data) {
            try {
                const canvas = document.getElementById('revenueChart');
                const ctx = canvas.getContext('2d');
                
                // Destroy existing chart if it exists
                if (revenueChart && typeof revenueChart.destroy === 'function') {
                    revenueChart.destroy();
                    revenueChart = null;
                }
                
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const sortedData = Object.values(data)
                    .filter(item => item.total_revenue > 0)
                    .sort((a, b) => b.total_revenue - a.total_revenue)
                    .slice(0, 10);
                
                revenueChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: sortedData.map(item => item.category.replace(/_/g, ' ')),
                        datasets: [{
                            data: sortedData.map(item => item.total_revenue),
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF',
                                '#4BC0C0', '#FF6384'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating revenue chart:', error);
            }
        }

        function createItemsChart(data) {
            try {
                const canvas = document.getElementById('itemsChart');
                const ctx = canvas.getContext('2d');
                
                // Destroy existing chart if it exists
                if (itemsChart && typeof itemsChart.destroy === 'function') {
                    itemsChart.destroy();
                    itemsChart = null;
                }
                
                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const sortedData = Object.values(data)
                    .filter(item => item.total_items_sold > 0)
                    .sort((a, b) => b.total_items_sold - a.total_items_sold)
                    .slice(0, 8);
                
                itemsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: sortedData.map(item => item.category.replace(/_/g, ' ')),
                        datasets: [{
                            label: 'Items Sold',
                            data: sortedData.map(item => item.total_items_sold),
                            backgroundColor: 'rgba(102, 126, 234, 0.8)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating items chart:', error);
            }
        }

        function loadDashboard(data) {
            updateStatsCards(data);
            updateTable(data);
            
            // Add small delay to ensure DOM is ready
            setTimeout(() => {
                createRevenueChart(data);
                createItemsChart(data);
            }, 100);
        }

        async function uploadAndAnalyze() {
            const csvFile = document.getElementById('csvFile').files[0];
            const excelFile = document.getElementById('excelFile').files[0];
            
            if (!csvFile) {
                alert('Please select a CSV file');
                return;
            }
            
            // Show loading indicator
            const uploadBtn = document.querySelector('.upload-btn');
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Processing...';
            
            const formData = new FormData();
            formData.append('csv_file', csvFile);
            if (excelFile) {
                formData.append('excel_file', excelFile);
            }
            
            try {
                console.log('Uploading files to API...');
                const response = await fetch('https://sunshinemarket.shop/api/revenue/analyze/all/labels', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (response.ok) {
                    const responseText = await response.text();
                    console.log('Raw response length:', responseText.length);
                    console.log('Raw response (first 500 chars):', responseText.substring(0, 500));
                    console.log('Response content type:', response.headers.get('content-type'));
                    
                    // Check if response is empty
                    if (!responseText.trim()) {
                        throw new Error('Empty response from server');
                    }
                    
                    try {
                        const data = JSON.parse(responseText);
                        console.log('Parsed data successfully!');
                        console.log('Full parsed data:', JSON.stringify(data, null, 2));
                        console.log('Data type:', typeof data);
                        console.log('Data keys:', Object.keys(data));
                        
                        // Check if data has the expected structure
                        if (data && typeof data === 'object' && Object.keys(data).length > 0) {
                            // Validate that the data has the expected category structure
                            const firstKey = Object.keys(data)[0];
                            const firstItem = data[firstKey];
                            
                            console.log('First category:', firstKey);
                            console.log('First item structure:', firstItem);
                            
                            if (firstItem && typeof firstItem === 'object' && 
                                firstItem.hasOwnProperty('total_revenue') && 
                                firstItem.hasOwnProperty('total_items_sold')) {
                                
                                loadDashboard(data);
                                alert('✅ Data loaded successfully!');
                                return; // Exit successfully
                            } else {
                                console.warn('Data structure does not match expected format');
                                console.log('Expected properties: total_revenue, total_items_sold, total_cost, etc.');
                                console.log('Actual properties:', Object.keys(firstItem || {}));
                            }
                        }
                        
                        // If we get here, the data structure is unexpected
                        throw new Error('Data structure does not match expected format');
                        
                    } catch (parseError) {
                        console.error('JSON parsing error:', parseError);
                        console.error('Error name:', parseError.name);
                        console.error('Error message:', parseError.message);
                        
                        // Show more of the response if it's not too long
                        const preview = responseText.length > 1000 ? 
                            responseText.substring(0, 1000) + '...' : responseText;
                        console.error('Failed to parse response:', preview);
                        
                        throw new Error(`JSON parsing failed: ${parseError.message}`);
                    }
                } else {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`API request failed with status ${response.status}: ${errorText}`);
                }
            } catch (error) {
                console.error('Upload Error:', error);
                alert(`❌ Error: ${error.message}\n\nUsing sample data for demonstration.`);
                loadDashboard(sampleData);
            } finally {
                // Reset button state
                uploadBtn.disabled = false;
                uploadBtn.textContent = '🔄 Analyze Revenue Data';
            }
        }

        // Initialize with sample data
        document.addEventListener('DOMContentLoaded', function() {
            // Don't load charts initially, just the data
            updateStatsCards(sampleData);
            updateTable(sampleData);
            
            // Load charts after a short delay to ensure everything is ready
            setTimeout(() => {
                createRevenueChart(sampleData);
                createItemsChart(sampleData);
            }, 500);
        });
    </script>
</body>
</html>
