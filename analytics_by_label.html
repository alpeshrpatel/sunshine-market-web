<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card .currency {
            color: #2ecc71;
        }

        .stat-card .number {
            color: #3498db;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chart-container h3 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .data-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }

        .category-name {
            font-weight: 600;
            color: #333;
            text-transform: capitalize;
        }

        .positive {
            color: #2ecc71;
        }

        .negative {
            color: #e74c3c;
        }

        .profit-margin {
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .profit-high {
            background-color: #d5f4e6;
            color: #2ecc71;
        }

        .profit-medium {
            background-color: #fff3cd;
            color: #856404;
        }

        .profit-low {
            background-color: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .stat-card {
                padding: 20px;
            }

            .data-table {
                font-size: 0.8em;
            }

            .data-table th,
            .data-table td {
                padding: 8px 10px;
            }
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .file-input {
            margin: 10px;
            padding: 8px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: rgba(102, 126, 234, 0.1);
        }

        .apply-filter-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(16, 185, 129, 0.3);
            margin-bottom: 20px;
        }


        .file-input {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .upload-info {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .filters-section {
            padding: 25px 30px;
            background: white;
            border-bottom: 1px solid #e0e6ff;
            display: block;
        }

        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-select,
        .filter-input {
            padding: 10px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            background: white;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .filter-select:focus,
        .filter-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .custom-date-inputs {
            display: none;
            gap: 10px;
            align-items: center;
        }

        .custom-date-inputs.show {
            display: flex;
        }

        .date-separator {
            font-weight: 600;
            color: #666;
        }

        .apply-filter-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(16, 185, 129, 0.3);
        }

        .apply-filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .reset-filter-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(239, 68, 68, 0.3);
        }

        .reset-filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .filter-status {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            color: #0284c7;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="header">
            <h1>📊 Revenue Analytics Dashboard</h1>
            <p>Comprehensive sales performance analysis across all categories</p>
        </div>

            <h3 style="margin-bottom: 20px; color: #333;">Upload Files for Analysis</h3>

                <input type="file" id="csvFile" accept=".csv" class="file-input">

        <div class="charts-section">

        <div class="table-container">

                <thead>

                        <th>Category</th>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        let salesData = [];
        let filteredData = [];
        let charts = {};
        let originalData = [];
        // ADD: Store original aggregated data for filtering
        let originalAggregatedData = {};
        let currentAggregatedData = {};

        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('applyFilter').addEventListener('click', applyFilter);
        });

        document.getElementById('dateFilter').addEventListener('change', handleDateFilterChange);
        document.getElementById('applyFilter').addEventListener('click', applyFilter);
        document.getElementById('resetFilter').addEventListener('click', resetFilter);

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(value);
        }

        function formatNumber(value) {
            return new Intl.NumberFormat('en-US').format(value);
        }

        function calculateTotals(data) {
            let totalRevenue = 0;
            let totalItems = 0;
            let totalCost = 0;
            let totalDiscount = 0;

            Object.values(data).forEach(item => {
                totalRevenue += item.total_revenue;
                totalItems += item.total_items_sold;
                totalCost += item.total_cost;
                totalDiscount += item.total_discount;
            });

            return {
                totalRevenue,
                totalItems,
                totalCost,
                totalDiscount,
                totalProfit: totalRevenue - totalCost,
                categories: Object.keys(data).length
            };
        }

        function updateStatsCards(data) {
            const totals = calculateTotals(data);
            const statsGrid = document.getElementById('statsGrid');

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <div class="value currency">${formatCurrency(totals.totalRevenue)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Items Sold</h3>
                    <div class="value number">${formatNumber(totals.totalItems)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Profit</h3>
                    <div class="value currency">${formatCurrency(totals.totalProfit)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Cost</h3>
                    <div class="value currency">${formatCurrency(totals.totalCost)}</div>
                </div>
                <div class="stat-card">
                    <h3>Total Discount</h3>
                    <div class="value currency">${formatCurrency(totals.totalDiscount)}</div>
                </div>
                <div class="stat-card">
                    <h3>Active Categories</h3>
                    <div class="value number">${totals.categories}</div>
                </div>
            `;
        }

        function updateTable(data) {
            const tableBody = document.getElementById('tableBody');
            const sortedData = Object.values(data).sort((a, b) => b.total_revenue - a.total_revenue);

            tableBody.innerHTML = '';

            sortedData.forEach(item => {
                const profit = item.total_revenue - item.total_cost;
                const margin = item.total_revenue > 0 ? (profit / item.total_revenue * 100) : 0;

                let marginClass = 'profit-low';
                if (margin > 50) marginClass = 'profit-high';
                else if (margin > 25) marginClass = 'profit-medium';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="category-name">${item.category.replace(/_/g, ' ')}</td>
                    <td>${formatNumber(item.total_items_sold)}</td>
                    <td>${formatCurrency(item.total_revenue)}</td>
                    <td>${formatCurrency(item.total_price)}</td>
                    <td class="${item.total_discount < 0 ? 'negative' : 'positive'}">${formatCurrency(item.total_discount)}</td>
                    <td>${formatCurrency(item.total_cost)}</td>
                    <td class="${profit >= 0 ? 'positive' : 'negative'}">${formatCurrency(profit)}</td>
                    <td><span class="profit-margin ${marginClass}">${margin.toFixed(1)}%</span></td>
                `;
                tableBody.appendChild(row);
            });
        }

        let revenueChart = null;
        let itemsChart = null;

        function createRevenueChart(data) {
            try {
                const canvas = document.getElementById('revenueChart');
                const ctx = canvas.getContext('2d');

                // Destroy existing chart if it exists
                if (revenueChart && typeof revenueChart.destroy === 'function') {
                    revenueChart.destroy();
                    revenueChart = null;
                }

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const sortedData = Object.values(data)
                    .filter(item => item.total_revenue > 0)
                    .sort((a, b) => b.total_revenue - a.total_revenue)
                    .slice(0, 10);

                revenueChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: sortedData.map(item => item.category.replace(/_/g, ' ')),
                        datasets: [{
                            data: sortedData.map(item => item.total_revenue),
                            backgroundColor: [
                                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                                '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF',
                                '#4BC0C0', '#FF6384'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating revenue chart:', error);
            }
        }

        function createItemsChart(data) {
            try {
                const canvas = document.getElementById('itemsChart');
                const ctx = canvas.getContext('2d');

                // Destroy existing chart if it exists
                if (itemsChart && typeof itemsChart.destroy === 'function') {
                    itemsChart.destroy();
                    itemsChart = null;
                }

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const sortedData = Object.values(data)
                    .filter(item => item.total_items_sold > 0)
                    .sort((a, b) => b.total_items_sold - a.total_items_sold)
                    .slice(0, 8);

                itemsChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: sortedData.map(item => item.category.replace(/_/g, ' ')),
                        datasets: [{
                            label: 'Items Sold',
                            data: sortedData.map(item => item.total_items_sold),
                            backgroundColor: 'rgba(102, 126, 234, 0.8)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating items chart:', error);
            }
        }

        function loadDashboard(data) {
            updateStatsCards(data);
            updateTable(data);

            // Add small delay to ensure DOM is ready
            setTimeout(() => {
                createRevenueChart(data);
                createItemsChart(data);
            }, 100);
        }

        const DB_NAME = 'AnalyticsDashboard';
        const DB_VERSION = 1;
        const STORE_NAME = 'dataFiles';

        let db = null;

        // Initialize IndexedDB
        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('fileName', 'fileName', { unique: false });
                        store.createIndex('fileType', 'fileType', { unique: false });
                        store.createIndex('uploadDate', 'uploadDate', { unique: false });
                    }
                };
            });
        }

        async function getAllFromIndexedDB() {
            if (!db) await initDB();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }



        window.addEventListener('DOMContentLoaded', async () => {
            const allData = await getAllFromIndexedDB();
            const csvFiles = allData.filter(item => item.fileType === 'csv');
            const excelFiles = allData.filter(item => item.fileType === 'excel');

            if (csvFiles.length === 0) {
                showMessage('No CSV file found in database. Please upload a CSV file first.', 'error');
                return;
            }

            // Get the latest files
            const latestCSV = csvFiles.sort((a, b) => new Date(b.uploadDate) - new Date(a.uploadDate))[0];
            const latestExcel = excelFiles.length > 0 ?
                excelFiles.sort((a, b) => new Date(b.uploadDate) - new Date(a.uploadDate))[0] : null;




            // Convert stored data back to File objects
            const csvFile = createFileFromData(latestCSV.fileName, latestCSV.data, 'csv');

            if (latestExcel) {
                try {
                    // First, let's check what worksheets are available in the Excel file
                    const tempExcelFile = createFileFromData(latestExcel.fileName, latestExcel.data, 'excel');
                    const worksheets = await getExcelWorksheets(tempExcelFile);

                    console.log('Available worksheets:', worksheets);

                    // Check if 'Items' worksheet exists
                    if (worksheets.includes('Items')) {
                        console.log("'Items' worksheet found!");
                        // Validate Excel data
                        const cleanedExcelData = validateAndCleanData(latestExcel.data, 'Excel');
                        excelFile = createFileFromData(latestExcel.fileName, cleanedExcelData, 'excel', 'Items');
                        console.log('✅ Excel file validated and cleaned');
                    } else {
                        // Show available worksheets to user and ask them to choose
                        const availableSheets = worksheets.join(', ');
                        console.log(`'Items' worksheet not found. Available worksheets: ${availableSheets}`);

                        // Try common alternative names for items/products
                        const commonItemsNames = ['Items', 'Products', 'Inventory', 'Stock', 'Sheet1', 'Data'];
                        let foundWorksheet = null;

                        for (const name of commonItemsNames) {
                            if (worksheets.includes(name)) {
                                foundWorksheet = name;
                                break;
                            }
                        }

                        if (foundWorksheet) {
                            console.log(`Using worksheet: ${foundWorksheet}`);
                            const cleanedExcelData = validateAndCleanData(latestExcel.data, 'Excel');
                            excelFile = createFileFromData(latestExcel.fileName, cleanedExcelData, 'excel', foundWorksheet);
                            console.log('✅ Excel file validated and cleaned');
                        } else {
                            // Let user choose worksheet
                            const userChoice = prompt(`The 'Items' worksheet was not found.\nAvailable worksheets: ${availableSheets}\n\nPlease enter the name of the worksheet you want to use:`);

                            if (userChoice && worksheets.includes(userChoice)) {
                                const cleanedExcelData = validateAndCleanData(latestExcel.data, 'Excel');
                                excelFile = createFileFromData(latestExcel.fileName, cleanedExcelData, 'excel', userChoice);

        // Convert data back to File object for API calls
        function createFileFromData(fileName, data, fileType, worksheetName = 'Items') {
            let content, mimeType;

            if (fileType === 'csv') {
                // Convert JSON back to CSV format
                if (data.length > 0) {
                    const headers = Object.keys(data[0]);
                    const csvContent = [
                        headers.join(','),
                        ...data.map(row => headers.map(header => {
                            const value = row[header];
                            // Escape commas and quotes in CSV values
                            if (typeof value === 'string' && (value.includes(',') || value.includes('"'))) {
                                return `"${value.replace(/"/g, '""')}"`;
                            }
                            return value;
                        }).join(','))
                    ].join('\n');
                    content = csvContent;
                    mimeType = 'text/csv';
                } else {
                    content = '';
                    mimeType = 'text/csv';
                }
            } else if (fileType === 'excel') {
                // Convert JSON back to Excel format using SheetJS
                if (typeof XLSX === 'undefined') {
                    console.error('XLSX library not loaded. Cannot create Excel file.');
                    throw new Error('XLSX library not available for Excel file creation');
                }

                // Convert JSON back to Excel format using SheetJS
                try {
                    const ws = XLSX.utils.json_to_sheet(data || []);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Instructions & Glossary');
                    XLSX.utils.book_append_sheet(wb, ws, 'Items');
                    const excelBuffer = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
                    content = new Uint8Array(excelBuffer);
                    mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                } catch (error) {
                    console.error('Error creating Excel file:', error);
                    throw new Error('Failed to create Excel file: ' + error.message);
                }
            }

            const blob = new Blob([content], { type: mimeType });
            return new File([blob], fileName, { type: mimeType });
        }

        async function storeExcelDataWithWorksheets(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        // Store data for each worksheet separately
                        const worksheetData = {};
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet);
                            worksheetData[sheetName] = jsonData;
                        });

                        console.log('Extracted worksheets:', Object.keys(worksheetData));
                        console.log('Items worksheet data sample:', worksheetData['Items'] ? worksheetData['Items'].slice(0, 2) : 'Not found');

                        resolve(worksheetData);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file);
            });
        }

        function validateAndCleanData(data, fileType) {
            if (!data || data.length === 0) {
                throw new Error(`No data found in ${fileType} file`);
            }

            // Check for required columns (add more as needed based on your API requirements)
            const requiredColumns = ['Clover ID']; // Add other required columns here
            const firstRow = data[0];
            const availableColumns = Object.keys(firstRow);

            console.log('Available columns:', availableColumns);
            console.log('Required columns:', requiredColumns);

            // Check for missing required columns
            const missingColumns = requiredColumns.filter(col => {
                // Check for exact match and variations
                return !availableColumns.some(availCol =>
                    availCol.toLowerCase().trim() === col.toLowerCase().trim()
                );
            });

            if (missingColumns.length > 0) {
                console.error('Missing required columns:', missingColumns);
                throw new Error(`Missing required columns: ${missingColumns.join(', ')}\nAvailable columns: ${availableColumns.join(', ')}`);
            }

            // Clean and standardize column names
            const cleanedData = data.map(row => {
                const cleanedRow = {};
                Object.keys(row).forEach(key => {
                    // Remove extra whitespace from column names
                    const cleanKey = key.trim();
                    // Standardize 'Clover ID' variations
                    if (cleanKey.toLowerCase().includes('clover') && cleanKey.toLowerCase().includes('id')) {
                        cleanedRow['Clover ID'] = row[key];
                    } else {
                        cleanedRow[cleanKey] = row[key];
                    }
                });
                return cleanedRow;
            });

            // Validate Clover ID values
            const invalidCloverIds = cleanedData.filter(row =>
                !row['Clover ID'] ||
                row['Clover ID'] === '' ||
                row['Clover ID'] === null ||
                row['Clover ID'] === undefined
            );

            if (invalidCloverIds.length > 0) {
                console.warn(`Found ${invalidCloverIds.length} rows with missing Clover ID`);
                // You might want to filter these out or handle them differently
                return cleanedData.filter(row => row['Clover ID'] && row['Clover ID'] !== '');
            }

            return cleanedData;
        }
